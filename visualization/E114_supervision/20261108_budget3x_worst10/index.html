  ctx.globalAlpha=1;ctx.textBaseline='alphabetic';ctx.fillStyle=color('muted-foreground');ctx.font=`${font}px system-ui`;
  ctx.textAlign='left';ctx.fillText(`${fmt(L[0],0)}, ${fmt(L[2],0)}`,pad,cv.height-3*ratio);
  ctx.textAlign='right';ctx.fillText(`${fmt(L[1],0)}, ${fmt(L[3],0)}`,cv.width-pad,font);
 }
 function legend(){
  const c=cases[selected],box=el('legend');box.replaceChildren();
  function key(label,fill,border){const item=document.createElement('span'),swatch=document.createElement('i'),text=document.createElement('span');item.className='bw-key';swatch.className='bw-swatch';swatch.style.background=fill;if(border)swatch.style.border=border;text.textContent=label;item.append(swatch,text);box.append(item)}
  for(const [g,rgb] of Object.entries(c.group_colors))key('分组 G'+g,`rgb(${rgb.join(',')})`);
  key('无分组',color('muted'));key('L/R/T/B 满足',color('green'));key('L/R/T/B 违反',color('red'));key('重叠模块','transparent','2px solid '+color('red'));key('布局外框','transparent','1px dashed '+color('muted-foreground'));
  const text=document.createElement('span');text.textContent='数字：模块编号 · F：固定形状 · P：预放置';box.append(text);
 }
 function render(){
  const c=cases[selected],d=+el('layer').value;
  el('depth').textContent=d+' / 12';el('draft-label').textContent='Draft · 第'+d+'层'+([4,12].includes(d)?'（直接监督）':'');
  el('meta').textContent=`${c.label} · dev #${c.evaluation_index} · N=${c.n} · best epoch 48 · ${c.member[0]} : ${c.member[1]}`;
  draw(canvases[0],c.reference,c,false,c.boundary_status.reference);draw(canvases[1],c.layers[d-1],c,el('overlap').checked,c.boundary_status.layers[d-1]);draw(canvases[2],c.final,c,false,c.boundary_status.final);
  el('selection').textContent=module<0?'全部模块':`模块 ${module} · ${attributes(c,module)}（再次点击取消定位）`;
  el('detail').textContent=`第${d}层重复覆盖 ${fmt(c.coverage[d-1]*100,2)}% · 最终 Q ${fmt(c.Q,6)}（原预算 ${fmt(c.old_Q,6)}） · 完整耗时 ${fmt(c.complete_seconds*1000,1)} ms · 硬合法 · 边界违规 ${c.boundary} · 分组违规 ${c.grouping}`;
  root.dataset.evaluationIndex=String(c.evaluation_index);root.dataset.layer=String(d);root.dataset.selectedModule=String(module);
 }
 function save(){
  if(!window.openai?.setWidgetState)return;
  const c=cases[selected];window.openai.setWidgetState({modelContent:{display_id:'e114-budget3x-worst10',evaluation_index:c.evaluation_index,rank:c.rank,member:c.member,layer:+el('layer').value,module},privateContent:{overlap:el('overlap').checked}}).catch(()=>{});
 }
 function apply(snapshot){
  const state=snapshot?.modelContent;if(!state||state.display_id!=='e114-budget3x-worst10')return;
  const index=cases.findIndex(c=>c.evaluation_index===state.evaluation_index);if(index>=0)selected=index;
  el('case').value=String(selected);el('layer').value=String(Math.max(1,Math.min(12,Number(state.layer)||12)));
  module=Number.isInteger(state.module)&&state.module>=0&&state.module<cases[selected].n?state.module:-1;
  if(typeof snapshot.privateContent?.overlap==='boolean')el('overlap').checked=snapshot.privateContent.overlap;
 }
 cases.forEach((c,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=`${c.label} · dev #${c.evaluation_index} · N=${c.n}`;el('case').append(option)});
 apply(window.openai?.widgetState);
 el('case').addEventListener('change',()=>{selected=+el('case').value;module=-1;legend();render();save()});
 el('layer').addEventListener('input',()=>{render();save()});el('overlap').addEventListener('change',()=>{render();save()});
 canvases.forEach((cv,k)=>cv.addEventListener('click',event=>{
  const c=cases[selected],p=k===0?c.reference:k===2?c.final:c.layers[+el('layer').value-1],rect=cv.getBoundingClientRect(),s=(cv.width-68)/(c.bounds[1]-c.bounds[0]);
  const x=((event.clientX-rect.left)*cv.width/rect.width-34)/s+c.bounds[0],y=(cv.height-34-(event.clientY-rect.top)*cv.height/rect.height)/s+c.bounds[2];
  let hit=-1;p.forEach((r,i)=>{if(x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3])hit=i});module=module===hit?-1:hit;render();save();
 }));
 new ResizeObserver(render).observe(root);
 new MutationObserver(()=>{legend();render()}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
 window.addEventListener('openai:set_globals',event=>{apply(event.detail?.globals?.widgetState);legend();render()});
 legend();render();
})();
</script>
