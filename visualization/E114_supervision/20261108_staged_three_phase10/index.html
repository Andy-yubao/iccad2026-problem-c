 el('group').addEventListener('change',options);el('case').addEventListener('change',()=>{selected=+el('case').value;module=-1;legend();render()});el('layer').addEventListener('input',render);el('overlap').addEventListener('change',render);
 canvases.forEach((cv,k)=>cv.addEventListener('click',event=>{const c=cases()[selected],p=k===0?c.reference:k===2?c.final:c.layers[+el('layer').value-1],rect=cv.getBoundingClientRect(),s=(cv.width-60)/(c.bounds[1]-c.bounds[0]),x=((event.clientX-rect.left)*cv.width/rect.width-30)/s+c.bounds[0],y=(cv.height-30-(event.clientY-rect.top)*cv.height/rect.height)/s+c.bounds[2];let hit=-1;p.forEach((r,i)=>{if(x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3])hit=i});module=module===hit?-1:hit;render()}));
 new ResizeObserver(render).observe(root);
 new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});options();
})();
</script>
